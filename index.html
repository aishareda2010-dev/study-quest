<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Quest</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
      color: #183b2a;
      padding: 25px;
      transition: 0.3s;
    }

    /* Language button */

    .language-box {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .language-btn {
      border: none;
      background: white;
      padding: 11px 16px;
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.1);
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .language-menu {
      display: none;
      position: absolute;
      top: 48px;
      left: 0;
      width: 150px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .language-menu button {
      width: 100%;
      border: none;
      background: white;
      padding: 14px;
      text-align: right;
      cursor: pointer;
      font-size: 15px;
    }

    .language-menu button:hover {
      background: #f0f7f2;
    }

    /* Screens */

    .screen {
      width: min(92%, 700px);
      margin: 40px auto;
      background: rgba(255,255,255,0.94);
      padding: 45px 35px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.10);
      animation: appear 0.5s ease;
    }

    .center {
      text-align: center;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #527064;
      font-size: 18px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    /* Buttons */

    .start-btn,
    .next-btn {
      border: none;
      padding: 16px 35px;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
      background: #2e7d5b;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .start-btn:hover,
    .next-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    /* Welcome */

    #welcomeScreen {
      margin-top: 15vh;
    }

    /* Profile */

    #profileScreen,
    #subjectsScreen {
      display: none;
    }

    label {
      display: block;
      text-align: right;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 2px solid #dce8e1;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #2e7d5b;
    }

    .gender-buttons {
      display: flex;
      gap: 12px;
    }

    .gender-buttons button {
      flex: 1;
      padding: 14px;
      border: 2px solid #dce8e1;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      font-size: 17px;
    }

    .gender-buttons button.selected {
      border-color: #2e7d5b;
      background: #e8f5e9;
    }

    /* Subjects */

    .subjects-counter {
      background: #e8f5e9;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 22px;
      font-weight: bold;
      color: #2e7d5b;
      text-align: center;
    }

    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .subject-card {
      background: white;
      border: 2px solid #e1e9e4;
      border-radius: 15px;
      padding: 17px 12px;
      cursor: pointer;
      text-align: right;
      transition: 0.2s;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subject-card:hover {
      transform: translateY(-2px);
    }

    .subject-card.selected {
      border-color: #2e7d5b;
      background: #f0faf3;
    }

    .check {
      width: 23px;
      height: 23px;
      border: 2px solid #cbd8d0;
      border-radius: 7px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .subject-card.selected .check {
      background: #2e7d5b;
      color: white;
      border-color: #2e7d5b;
    }

    @media (max-width: 500px) {

      .screen {
        padding: 30px 20px;
      }

      .subjects-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 30px;
      }

    }

    @keyframes appear {

      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

  </style>

</head>

<body>


  <!-- Language -->

  <div class="language-box">

    <button
      class="language-btn"
      onclick="toggleLanguageMenu()"
      id="languageButton"
    >
      🌐 العربية
    </button>

    <div
      class="language-menu"
      id="languageMenu"
    >

      <button onclick="setLanguage('ar')">
        🇪🇬 العربية
      </button>

      <button onclick="setLanguage('en')">
        🇬🇧 English
      </button>

    </div>

  </div>


  <!-- Welcome -->

  <div
    class="screen center"
    id="welcomeScreen"
  >

    <div class="logo">
      📚
    </div>

    <h1 id="welcomeTitle">
      Study Quest
    </h1>

    <p
      class="subtitle"
      id="welcomeSubtitle"
    >
      رحلتك في المذاكرة تبدأ من هنا ✨
    </p>

    <button
      class="start-btn"
      onclick="startJourney()"
      id="startButton"
    >
      ابدأ رحلتك 🚀
    </button>

  </div>


  <!-- Profile -->

  <div
    class="screen"
    id="profileScreen"
  >

    <div class="center">

      <div class="logo">
        👋
      </div>

      <h1 id="profileTitle">
        أهلاً بيك!
      </h1>

      <p
        class="subtitle"
        id="profileSubtitle"
      >
        خلينا نجهز حسابك 📚
      </p>

    </div>


    <label id="nameLabel">
      👤 اسمك
    </label>

    <input
      type="text"
      id="name"
      placeholder="اكتب اسمك"
    >


    <label id="ageLabel">
      🎂 سنك
    </label>

    <input
      type="number"
      id="age"
      placeholder="اكتب سنك"
      min="5"
      max="100"
    >


    <label id="genderLabel">
      🧑 أنت
    </label>

    <div class="gender-buttons">

      <button
        id="boyBtn"
        onclick="chooseGender('boy')"
      >
        👦 ولد
      </button>

      <button
        id="girlBtn"
        onclick="chooseGender('girl')"
      >
        👧 بنت
      </button>

    </div>


    <label id="gradeLabel">
      🎓 صفك الدراسي
    </label>

    <select id="grade">

      <option value="" id="gradePlaceholder
