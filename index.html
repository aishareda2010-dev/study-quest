<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Quest 🎓</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff, #ffffff);
      color: #202438;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      text-align: center;
    }

    .logo {
      font-size: 60px;
    }

    h1 {
      font-size: 36px;
      margin: 10px 0;
    }

    p {
      color: #70778a;
    }

    input, select {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
    }

    .gender {
      display: flex;
      gap: 10px;
      margin: 10px 0;
    }

    .gender button {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      background: #f0f1f6;
    }

    .gender button.selected {
      background: #dedaff;
      outline: 3px solid #6c63ff;
    }

    .start {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: #6c63ff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    /* Dashboard */

    #dashboard {
      min-height: 100vh;
      padding: 25px;
      max-width: 1000px;
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 5px 15px rgba(0,0,0,.1);
    }

    .hero {
      margin-top: 20px;
      padding: 25px;
      border-radius: 25px;
      background: linear-gradient(135deg, #6c63ff, #928aff);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero p {
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 15px 0;
    }

    .stat {
      background: white;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,.06);
    }

    .stat b {
      display: block;
      font-size: 25px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .feature {
      border: 0;
      background: white;
      padding: 25px;
      border-radius: 20px;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,.06);
    }

    .feature span {
      display: block;
      font-size: 15px;
      margin-top: 8px;
      font-weight: bold;
    }

    @media(max-width:600px) {
      .stats {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .hero {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<!-- صفحة البداية -->

<div id="welcome" class="page">

  <div class="card">

    <div class="logo">🎓</div>

    <h1>Study Quest</h1>

    <p>مذاكرتك... بس بطريقة أمتع 🚀</p>

    <input
      id="name"
      type="text"
      placeholder="اكتب اسمك"
    >

    <select id="grade">
      <option value="">اختار السنة الدراسية</option>
      <option>أولى إعدادي</option>
      <option>تانية إعدادي</option>
      <option>تالتة إعدادي</option>
      <option>أولى ثانوي</option>
      <option>تانية ثانوي</option>
      <option>تالتة ثانوي</option>
    </select>

    <div class="gender">

      <button id="boyBtn" onclick="chooseGender('boy')">
        👦 ولد
      </button>

      <button id="girlBtn" onclick="chooseGender('girl')">
        👧 بنت
      </button>

    </div>

    <button class="start" onclick="startApp()">
      ابدأ 🚀
    </button>

  </div>

</div>


<!-- Dashboard -->

<div id="dashboard" class="hidden">

  <div class="top">

    <div>
      <small>أهلاً بيك 👋</small>
      <h2 id="hello"></h2>
    </div>

    <div class="avatar" id="avatar">
      🎓
    </div>

  </div>


  <div class="hero">

    <div>
      <h2>جاهز تنجز؟ 🔥</h2>
      <p>خلّي النهارده خطوة جديدة!</p>
    </div>

    <div>
      🔥 <b>1</b>
      <br>
      <small>Streak</small>
    </div>

  </div>


  <div class="stats">

    <div class="stat">
      <b id="tasks">0</b>
      <span>مهام منجزة</span>
    </div>

    <div class="stat">
      <b id="xp">0</b>
      <span>XP ⭐</span>
    </div>

    <div class="stat">
      <b>0</b>
      <span>دقيقة مذاكرة</span>
    </div>

  </div>


  <div class="features">

    <button class="feature" onclick="tasks()">
      ✅
      <span>المهام</span>
    </button>

    <button class="feature" onclick="focusMode()">
      ⏱️
      <span>Focus Mode</span>
    </button>

    <button class="feature" onclick="subjects()">
      📚
      <span>المواد</span>
    </button>

    <button class="feature" onclick="quiz()">
      🧠
      <span>Quiz</span>
    </button>

  </div>

</div>


<script>

let gender = "";
let completedTasks = 0;
let XP = 0;


function chooseGender(type) {

  gender = type;

  document
    .getElementById("boyBtn")
    .classList.remove("selected");

  document
    .getElementById("girlBtn")
    .classList.remove("selected");


  if(type === "boy") {

    document
      .getElementById("boyBtn")
      .classList.add("selected");

  }

  if(type === "girl") {

    document
      .getElementById("girlBtn")
      .classList.add("selected");

  }

}


function startApp() {

  let name =
    document.getElementById("name").value.trim();

  let grade =
    document.getElementById("grade").value;


  if(name === "" || grade === "" || gender === "") {

    alert("اكتب اسمك واختار السنة والنوع الأول 😊");

    return;

  }


  document
    .getElementById("welcome")
    .classList.add("hidden");


  document
    .getElementById("dashboard")
    .classList.remove("hidden");


  document
    .getElementById("hello")
    .innerText =
      name + " 👋";


  if(gender === "girl") {

    document
      .getElementById("avatar")
      .innerText = "🎀";

    document.body.style.background =
      "linear-gradient(135deg,#fff0f7,#f6efff)";

  }


  if(gender === "boy") {

    document
      .getElementById("avatar")
      .innerText = "🏎️";

    document.body.style.background =
      "linear-gradient(135deg,#eef3ff,#f5f7fb)";

  }

}


function tasks() {

  completedTasks++;

  XP += 20;

  document.getElementById("tasks").innerText =
    completedTasks;

  document.getElementById("xp").innerText =
    XP;

  alert("🎉 أحسنت! أنجزت مهمة وكسبت 20 XP");

}


function focusMode() {

  alert(
    "⏱️ Focus Mode\n\nPomodoro قريبًا 🔥"
  );

}


function subjects() {

  alert(
    "📚 المواد\n\nMath\nScience\nEnglish\nArabic\nFrench"
  );

}


function quiz() {

  let answer =
    confirm("🧠 Quiz سريع\n\nما ناتج 5 × 6 ؟\n\nاضغط OK للإجابة 30");

  if(answer) {

    XP += 30;

    document.getElementById("xp").innerText =
      XP;

    alert("🎉 إجابة صحيحة! +30 XP");

  }

}

</script>

</body>
</html>
