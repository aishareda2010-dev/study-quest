<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Quest</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
  color: #183b2a;
  padding: 25px;
}

/* LANGUAGE */

.language-box {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 1000;
}

.language-btn {
  border: none;
  background: white;
  padding: 11px 16px;
  border-radius: 12px;
  box-shadow: 0 5px 18px rgba(0,0,0,.12);
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
}

.language-menu {
  display: none;
  position: absolute;
  top: 48px;
  left: 0;
  width: 150px;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.15);
}

.language-menu button {
  width: 100%;
  border: none;
  background: white;
  padding: 14px;
  cursor: pointer;
  font-size: 15px;
  text-align: right;
}

.language-menu button:hover {
  background: #f0f7f2;
}

/* SCREENS */

.screen {
  width: min(92%, 700px);
  margin: 40px auto;
  background: rgba(255,255,255,.96);
  padding: 45px 35px;
  border-radius: 30px;
  box-shadow: 0 20px 50px rgba(0,0,0,.10);
}

.center {
  text-align: center;
}

.logo {
  font-size: 55px;
  margin-bottom: 12px;
}

h1 {
  font-size: 36px;
  margin-bottom: 12px;
}

.subtitle {
  color: #527064;
  font-size: 18px;
  margin-bottom: 30px;
  line-height: 1.6;
}

/* BUTTONS */

.start-btn,
.next-btn {
  border: none;
  padding: 16px 35px;
  border-radius: 15px;
  font-size: 18px;
  font-weight: bold;
  background: #2e7d5b;
  color: white;
  cursor: pointer;
  transition: .2s;
}

.start-btn:hover,
.next-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(0,0,0,.15);
}

.next-btn {
  width: 100%;
  margin-top: 30px;
}

/* HIDDEN */

#profileScreen,
#characterScreen,
#subjectsScreen,
#dashboardScreen {
  display: none;
}

/* PROFILE */

label {
  display: block;
  margin: 18px 0 8px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 14px;
  border: 2px solid #dce8e1;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  background: white;
}

input:focus,
select:focus {
  border-color: #2e7d5b;
}

.gender-buttons {
  display: flex;
  gap: 12px;
}

.gender-buttons button {
  flex: 1;
  padding: 14px;
  border: 2px solid #dce8e1;
  border-radius: 12px;
  background: white;
  cursor: pointer;
  font-size: 17px;
}

.gender-buttons button.selected {
  border-color: #2e7d5b;
  background: #e8f5e9;
}

/* CHARACTER */

.character-area {
  text-align: center;
  margin: 20px 0 30px;
}

.character {
  width: 180px;
  height: 270px;
  margin: auto;
  position: relative;
}

.head {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #d99b78;
  position: absolute;
  top: 10px;
  left: 45px;
  z-index: 3;
}

.hair {
  width: 92px;
  height: 48px;
  background: #3a2921;
  border-radius: 50px 50px 20px 20px;
  position: absolute;
  top: 3px;
  left: 44px;
  z-index: 4;
}

.eye {
  width: 9px;
  height: 9px;
  background: #222;
  border-radius: 50%;
  position: absolute;
  top: 48px;
  z-index: 5;
}

.eye.left {
  left: 68px;
}

.eye.right {
  left: 103px;
}

.body-character {
  width: 115px;
  height: 105px;
  background: #6fa8dc;
  border-radius: 35px 35px 20px 20px;
  position: absolute;
  top: 92px;
  left: 32px;
}

.arm {
  width: 28px;
  height: 85px;
  background: #d99b78;
  border-radius: 20px;
  position: absolute;
  top: 105px;
}

.arm.left {
  left: 12px;
  transform: rotate(12deg);
}

.arm.right {
  right: 12px;
  transform: rotate(-12deg);
}

.leg {
  width: 42px;
  height: 80px;
  background: #333;
  position: absolute;
  top: 185px;
  border-radius: 10px;
}

.leg.left {
  left: 47px;
}

.leg.right {
  right: 47px;
}

.character-options {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
}

.character-options button {
  border: 2px solid #e1e9e4;
  background: white;
  border-radius: 18px;
  padding: 15px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
}

.character-options button.selected {
  border-color: #2e7d5b;
  background: #e8f5e9;
}

/* SUBJECTS */

.subjects-counter {
  background: #e8f5e9;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 22px;
  font-weight: bold;
  color: #2e7d5b;
  text-align: center;
}

.subjects-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
}

.subject-card {
  background: white;
  border: 2px solid #e1e9e4;
  border-radius: 15px;
  padding: 17px 12px;
  cursor: pointer;
  transition: .2s;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.subject-card.selected {
  border-color: #2e7d5b;
  background: #f0faf3;
}

.check {
  width: 23px;
  height: 23px;
  border: 2px solid #cbd8d0;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.subject-card.selected .check {
  background: #2e7d5b;
  color: white;
  border-color: #2e7d5b;
}

/* ================= DASHBOARD ================= */

#dashboardScreen {
  width: 100%;
  min-height: calc(100vh - 50px);
  margin: 0;
  padding: 0;
  background: transparent;
  box-shadow: none;
}

.dashboard {
  display: flex;
  min-height: calc(100vh - 50px);
  gap: 20px;
}

/* SIDEBAR */

.sidebar {
  width: 245px;
  background: rgba(255,255,255,.96);
  border-radius: 25px;
  padding: 25px 15px;
  box-shadow: 0 15px 40px rgba(0,0,0,.10);
  flex-shrink: 0;
}

.sidebar-logo {
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  color: #2e7d5b;
  margin-bottom: 25px;
}

.menu-btn {
  width: 100%;
  border: none;
  background: transparent;
  padding: 14px;
  margin: 4px 0;
  border-radius: 13px;
  text-align: right;
  font-size: 16px;
  cursor: pointer;
  color: #36594a;
}

.menu-btn:hover,
.menu-btn.active {
  background: #e8f5e9;
  color: #2e7d5b;
  font-weight: bold;
}

/* DASHBOARD CONTENT */

.dashboard-content {
  flex: 1;
  min-width: 0;
}

.dashboard-header {
  background: rgba(255,255,255,.96);
  border-radius: 25px;
  padding: 25px 30px;
  box-shadow: 0 15px 40px rgba(0,0,0,.08);
  margin-bottom: 20px;
}

.dashboard-header h1 {
  font-size: 30px;
  margin-bottom: 8px;
}

.date-text {
  color: #678074;
  font-size: 16px;
}

/* CARDS */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 15px;
  margin-bottom: 20px;
}

.stat-card {
  background: rgba(255,255,255,.96);
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.07);
}

.stat-icon {
  font-size: 28px;
  margin-bottom: 8px;
}

.stat-title {
  color: #678074;
  font-size: 14px;
  margin-bottom: 7px;
}

.stat-value {
  font-size: 24px;
  font-weight: bold;
}

/* DASHBOARD GRID */

.dashboard-grid {
  display: grid;
  grid-template-columns: 1.3fr .7fr;
  gap: 20px;
}

.dashboard-card {
  background: rgba(255,255,255,.96);
  border-radius: 22px;
  padding: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,.07);
  margin-bottom: 20px;
}

.card-title {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 20px;
}

/* SCHEDULE */

.schedule-item {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px;
  background: #f5faf7;
  border-radius: 15px;
  margin-bottom: 10px;
}

.schedule-time {
  font-weight: bold;
  color: #2e7d5b;
  min-width: 70px;
}

.schedule-subject {
  flex: 1;
}

.schedule-status {
  font-size: 13px;
  color: #708278;
}

/* TODO */

.todo-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid #edf2ef;
}

.todo-item:last-child {
  border-bottom: none;
}

.todo-check {
  width: 22px;
  height: 22px;
  cursor: pointer;
  accent-color: #2e7d5b;
}

.todo-text {
  flex: 1;
}

.todo-item.done .todo-text {
  text-decoration: line-through;
  color: #91a099;
}

/* PROGRESS */

.progress-container {
  background: #e7eee9;
  height: 14px;
  border-radius: 20px;
  overflow: hidden;
  margin: 15px 0;
}

.progress-bar {
  height: 100%;
  width: 60%;
  background: #2e7d5b;
  border-radius: 20px;
}

/* FOCUS */

.focus-btn {
  width: 100%;
  border: none;
  background: #2e7d5b;
  color: white;
  padding: 16px;
  border-radius: 15px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.focus-btn:hover {
  transform: translateY(-2px);
}

/* PROFILE MINI */

.profile-mini {
  text-align: center;
  padding: 15px;
  background: #f4faf6;
  border-radius: 18px;
  margin-top: 20px;
}

.mini-avatar {
  width: 65px;
  height: 65px;
  margin: auto auto 10px;
  border-radius: 50%;
  background
