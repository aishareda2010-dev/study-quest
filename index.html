<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Quest</title>
<style>
:root{--bg1:#eef7ff;--bg2:#f5f1ff;--card:#fff;--text:#17233c;--muted:#667085;--primary:#6c63ff;--primary2:#8b85ff;--line:#e8eaf2;--ok:#35a77a;--shadow:0 18px 45px #27304a18}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Tahoma,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.hidden{display:none!important}.app{min-height:100vh}.topbar{height:72px;background:#ffffffdd;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:22px}.menu-btn{width:44px;height:44px;border-radius:14px;background:#f2f1ff;font-size:22px}
.page{max-width:1180px;margin:auto;padding:30px 20px 50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:24px}
.btn{padding:13px 19px;border-radius:14px;font-weight:700}.primary{background:var(--primary);color:#fff}.secondary{background:#f0efff;color:#5149d9}.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.danger{background:#fff0f0;color:#c43d3d}
.screen-center{max-width:720px;margin:70px auto;text-align:center}.logo{font-size:70px;margin-bottom:10px}.title{font-size:42px;margin-bottom:12px}.sub{color:var(--muted);font-size:18px;line-height:1.7}.start{margin-top:28px;padding:17px 35px;border-radius:16px;background:var(--primary);color:#fff;font-size:18px;font-weight:800}
.form{max-width:620px;margin:35px auto}.form h2{text-align:center;margin-bottom:8px}.field{margin-top:18px}.field label{display:block;font-weight:700;margin-bottom:8px}.field input,.field select,.field textarea{width:100%;padding:14px;border:2px solid var(--line);border-radius:13px;outline:none;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gender button{padding:14px;border:2px solid var(--line);border-radius:13px;background:#fff}.gender .chosen{border-color:var(--primary);background:#f1f0ff}
.character-wrap{text-align:center;margin:25px}.avatar{width:160px;height:210px;margin:auto;position:relative}.head{width:78px;height:78px;border-radius:50%;background:#d99b78;position:absolute;top:5px;left:41px;z-index:3}.hair{width:82px;height:42px;border-radius:45px 45px 16px 16px;background:#392b25;position:absolute;top:0;left:39px;z-index:4}.eye{width:8px;height:8px;border-radius:50%;background:#222;position:absolute;top:43px;z-index:5}.e1{left:60px}.e2{left:91px}.shirt{width:104px;height:92px;border-radius:30px 30px 16px 16px;background:#6c9ee8;position:absolute;top:80px;left:28px}.arm{width:24px;height:72px;border-radius:20px;background:#d99b78;position:absolute;top:91px}.a1{left:9px;transform:rotate(12deg)}.a2{right:9px;transform:rotate(-12deg)}.leg{width:36px;height:70px;border-radius:10px;background:#353b4a;position:absolute;top:164px}.l1{left:42px}.l2{right:42px}
.options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.options button{padding:14px;border:2px solid var(--line);border-radius:15px;background:#fff}.options .chosen{border-color:var(--primary);background:#f1f0ff}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.subject{padding:15px;border:2px solid var(--line);border-radius:15px;background:#fff;text-align:right}.subject.on{border-color:var(--ok);background:#f0fbf6}.check{display:inline-flex;width:24px;height:24px;border:2px solid #ccd2df;border-radius:7px;align-items:center;justify-content:center;margin-left:8px}.subject.on .check{background:var(--ok);color:#fff;border-color:var(--ok)}
.dashboard-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat strong{display:block;font-size:28px;margin-top:8px}.muted{color:var(--muted)}.dashgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:18px}.tasks{display:grid;gap:10px}.task{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:14px}.task.done{text-decoration:line-through;opacity:.55}.task input{width:20px;height:20px}.progress{height:10px;background:#ececf5;border-radius:20px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--primary);width:0}.subject-row{margin-top:15px}.subject-row-top{display:flex;justify-content:space-between}
.side{position:fixed;top:0;bottom:0;right:-340px;width:320px;background:#fff;z-index:50;box-shadow:-15px 0 40px #1112;padding:22px;transition:.25s;overflow:auto}.side.open{right:0}.side .close{float:left;background:#f2f2f7;border-radius:10px;padding:8px}.profile-mini{clear:both;padding:25px 0 15px;text-align:center}.mini-avatar{font-size:55px}.side button.item{width:100%;padding:14px;margin:5px 0;border-radius:13px;background:#f7f7fb;text-align:right}.overlay{position:fixed;inset:0;background:#0004;z-index:40;display:none}.overlay.show{display:block}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.day{min-height:170px}.day h3{font-size:15px;margin-bottom:10px}.day .pill{background:#f0efff;border-radius:10px;padding:8px;margin:6px 0;font-size:13px}.add{background:#f7f7fb;border:1px dashed #cdd0dc;width:100%;padding:8px;border-radius:10px}
.timer{text-align:center}.timer-circle{width:240px;height:240px;border-radius:50%;border:12px solid #ececf8;display:flex;align-items:center;justify-content:center;margin:25px auto;font-size:42px;font-weight:800}.timer-controls{display:flex;justify-content:center;gap:10px}.modes{display:flex;justify-content:center;gap:8px}.modes button.active{background:var(--primary);color:#fff}
.notes textarea{min-height:260px;resize:vertical}.list{display:grid;gap:10px;margin-top:15px}.empty{text-align:center;padding:35px;color:var(--muted)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.switch{padding:8px 13px;border-radius:12px;background:#eee}.switch.on{background:#dff7eb;color:#198657}
@media(max-width:800px){.grid4{grid-template-columns:repeat(2,1fr)}.dashgrid{grid-template-columns:1fr}.subjects{grid-template-columns:repeat(2,1fr)}.week{grid-template-columns:repeat(2,1fr)}.options{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.title{font-size:32px}.page{padding:20px 12px}.subjects{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.week{grid-template-columns:1fr}.topbar{padding:0 12px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay" onclick="closeSide()"></div>
<aside class="side" id="side">
<button class="close" onclick="closeSide()">✕</button>
<div class="profile-mini"><div class="mini-avatar" id="sideAvatar">🧑</div><b id="sideName">طالب</b><div class="muted" id="sideGrade">—</div></div>
<button class="item" onclick="showPage('dashboard');closeSide()">🏠 الرئيسية</button>
<button class="item" onclick="showPage('calendar');closeSide()">📅 الجدول الأسبوعي</button>
<button class="item" onclick="showPage('tasks');closeSide()">✅ المهام</button>
<button class="item" onclick="showPage('focus');closeSide()">⏱️ جلسة مذاكرة</button>
<button class="item" onclick="showPage('subjects');closeSide()">📚 المواد</button>
<button class="item" onclick="showPage('notes');closeSide()">📝 الملاحظات</button>
<button class="item" onclick="showPage('stats');closeSide()">📊 الإحصائيات</button>
<button class="item" onclick="showPage('settings');closeSide()">⚙️ الإعدادات</button>
<hr style="margin:15px 0;border:0;border-top:1px solid var(--line)">
<button class="item" onclick="createAccount()">➕ إنشاء حساب جديد</button>
<button class="item danger" onclick="deleteAccount()">🗑️ حذف الحساب</button>
</aside>

<script>
const SUBJECTS=['القرآن الكريم وتجويده','أصول الدين','الفقه','النحو','الصرف','المطالعة والنصوص والقصة','الإنشاء','الإملاء','الخط','الدراسات الاجتماعية','العلوم','الرياضيات','اللغة الإنجليزية','الحاسب الآلي','التربية الفنية'];
let state=JSON.parse(localStorage.getItem('studyQuest')||'null')||{setup:false,name:'',age:'',gender:'',grade:'',character:'',subjects:[],tasks:[],notes:'',minutes:0,streak:0,theme:'light',sound:true,lang:'ar'};
let timer=null, seconds=25*60;

function save(){localStorage.setItem('studyQuest',JSON.stringify(state))}
function render(){
 if(!state.setup){welcome();return}
 dashboard();
}
function welcome(){
 document.getElementById('app').innerHTML=`<main class="page"><section class="screen-center card">
 <div class="logo">📚✨</div><h1 class="title">Study Quest</h1>
 <p class="sub">رحلتك في المذاكرة تبدأ من هنا.<br>نظّم وقتك، ذاكر بتركيز، وشوف تقدمك خطوة بخطوة 🚀</p>
 <button class="start" onclick="profile()">ابدأ رحلتك 🚀</button>
 </section></main>`;
}
function profile(){
 document.getElementById('app').innerHTML=`<main class="page"><section class="card form">
 <h2>👋 أهلاً بيك!</h2><p class="sub" style="text-align:center">خلينا نجهز حسابك</p>
 <div class="field"><label>👤 اسمك</label><input id="name" placeholder="اكتب اسمك"></div>
 <div class="field"><label>🎂 سنك</label><input id="age" type="number" placeholder="اكتب سنك"></div>
 <div class="field"><label>🧑 أنت</label><div class="gender"><button id="gb" onclick="gender('boy')">👦 ولد</button><button id="gg" onclick="gender('girl')">👧 بنت</button></div></div>
 <div class="field"><label>🎓 صفك الدراسي</label><select id="grade"><option value="">اختار الصف</option><option>أولى إعدادي</option><option>تانية إعدادي</option><option>تالتة إعدادي</option></select></div>
 <button class="btn primary" style="width:100%;margin-top:24px" onclick="profileNext()">التالي ➜</button>
 </section></main>`;
}
function gender(x){state.gender=x;document.getElementById('gb').classList.toggle('chosen',x==='boy');document.getElementById('gg').classList.toggle('chosen',x==='girl')}
function profileNext(){
 const n=document.getElementById('name').value.trim(),a=document.getElementById('age').value,g=document.getElementById('grade').value;
 if(!n||!a||!state.gender||!g)return alert('من فضلك كمّل كل البيانات الأول ❤️');
 state.name=n;state.age=a;state.grade=g;character();
}
function character(){
 document.getElementById('app').innerHTML=`<main class="page"><section class="card form">
 <h2 style="text-align:center">🧍 اختار شخصيتك</h2><p class="sub" style="text-align:center">دي الشخصية اللي هتمثلك في Study Quest ✨</p>
 <div class="character-wrap"><div class="avatar"><div class="head"></div><div class="hair" id="hair"></div><div class="eye e1"></div><div class="eye e2"></div><div class="shirt" id="shirt"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div></div>
 <div class="options"><button onclick="char('boy1',this)">👦 ولد 1</button><button onclick="char('boy2',this)">👦 ولد 2</button><button onclick="char('girl1',this)">👧 بنت 1</button><button onclick="char('girl2',this)">👧 بنت 2</button></div>
 <button class="btn primary" style="width:100%;margin-top:24px" onclick="subjectsPage()">التالي ➜</button></section></main>`;
}
function char(c,b){state.character=c;document.querySelectorAll('.options button').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');const s=document.getElementById('shirt'),h=document.getElementById('hair');let colors={boy1:['#6c9ee8','#392b25'],boy2:['#6db77f','#222'],girl1:['#d58caf','#392b25'],girl2:['#f1ad68','#5b351f']};s.style.background=colors[c][0];h.style.background=colors[c][1]}
function subjectsPage(){
 if(!state.character)return alert('اختار شخصيتك الأول 🧍');
 document.getElementById('app').innerHTML=`<main class="page"><section class="card">
 <h2 style="text-align:center">📚 موادك الدراسية</h2><p class="sub" style="text-align:center;margin:8px 0 22px">اختار المواد اللي بتدرسها</p>
 <div class="subjects">${SUBJECTS.map((s,i)=>`<button class="subject ${state.subjects.includes(s)?'on':''}" onclick="toggleSub(${i},this)"><span class="check">✓</span>${s}</button>`).join('')}</div>
 <div style="margin-top:18px;text-align:center" class="muted">تم اختيار <b id="sc">${state.subjects.length}</b> مادة</div>
 <button class="btn primary" style="width:100%;margin-top:22px" onclick="finishSetup()">دخول إلى Study Quest 🚀</button>
 </section></main>`;
}
function toggleSub(i,b){let s=SUBJECTS[i];if(state.subjects.includes(s)){state.subjects=state.subjects.filter(x=>x!==s);b.classList.remove('on')}else{state.subjects.push(s);b.classList.add('on')}document.getElementById('sc').textContent=state.subjects.length}
function finishSetup(){if(!state.subjects.length)return alert('اختار مادة واحدة على الأقل 📚');state.setup=true;state.streak=state.streak||1;save();render()}
function shell(content,title='Study Quest'){document.getElementById('app').innerHTML=`<div class="app"><header class="topbar"><div class="brand">📚 Study Quest</div><button class="menu-btn" onclick="openSide()">☰</button></header><main class="page"><div class="dashboard-head"><div><h1>${title}</h1><p class="muted">أهلاً ${state.name} 👋</p></div><button class="btn primary" onclick="showPage('focus')">▶ ابدأ جلسة</button></div>${content}</main></div>`}
function openSide(){document.getElementById('side').classList.add('open');document.getElementById('overlay').classList.add('show');document.getElementById('sideName').textContent=state.name;document.getElementById('sideGrade').textContent=state.grade;document.getElementById('sideAvatar').textContent=state.character?.startsWith('girl')?'👧':'👦'}
function closeSide(){document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function showPage(p){({dashboard,tasks,calendar,focus,subjects,notes,stats,settings}[p]||dashboard)()}
function dashboard(){
 const done=state.tasks.filter(t=>t.done).length, total=state.tasks.length, pct=total?Math.round(done/total*100):0;
 shell(`<div class="grid4"><div class="card stat">⏱️ وقت المذاكرة<strong>${state.minutes} د</strong></div><div class="card stat">🔥 Streak<strong>${state.streak} يوم</strong></div><div class="card stat">✅ المهام<strong>${done}/${total}</strong></div><div class="card stat">📚 المواد<strong>${state.subjects.length}</strong></div></div>
 <div class="dashgrid"><section class="card"><h2>🎯 خطة اليوم</h2><p class="muted" style="margin:8px 0">إنجاز المهام اليوم</p><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="list">${state.tasks.slice(0,5).map((t,i)=>taskHTML(t,i)).join('')||'<div class="empty">مفيش مهام لسه. أضف أول مهمة 👇</div>'}</div><button class="btn secondary" style="margin-top:14px" onclick="showPage('tasks')">إدارة المهام</button></section>
 <section class="card"><h2>📚 تقدم المواد</h2>${state.subjects.slice(0,6).map(s=>`<div class="subject-row"><div class="subject-row-top"><span>${s}</span><span>0%</span></div><div class="progress"><div class="bar" style="width:0"></div></div></div>`).join('')}</section></div>`)
}
function taskHTML(t,i){return `<label class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})"><span>${t.text}</span></label>`}
function tasks(){shell(`<section class="card"><h2>✅ To-Do List</h2><div style="display:flex;gap:8px;margin-top:16px"><input id="newTask" style="flex:1;padding:13px;border:2px solid var(--line);border-radius:13px" placeholder="مثلاً: أحل 20 سؤال رياضيات"><button class="btn primary" onclick="addTask()">إضافة</button></div><div class="list">${state.tasks.map((t,i)=>taskHTML(t,i)).join('')||'<div class="empty">اكتب أول مهمة عندك ✨</div>'}</div></section>`)}
function addTask(){let x=document.getElementById('newTask').value.trim();if(!x)return;state.tasks.push({text:x,done:false});save();tasks()}
function toggleTask(i){state.tasks[i].done=!state.tasks[i].done;save();showPage('dashboard')}
function calendar(){let days=['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];shell(`<section class="card"><h2>📅 الجدول الأسبوعي</h2><p class="muted" style="margin:8px 0 18px">نظّم المواد حسب كل يوم.</p><div class="week">${days.map(d=>`<div class="day card" style="box-shadow:none;padding:12px"><h3>${d}</h3><div class="pill">📚 ${state.subjects[0]||'مادة'}</div><button class="add" onclick="alert('قريبًا: إضافة مادة لهذا اليوم')">+ إضافة</button></div>`).join('')}</div></section>`)}
function focus(){shell(`<section class="card timer"><h2>⏱️ جلسة مذاكرة</h2><p class="muted">اختار مدة التركيز</p><div class="modes" style="margin-top:15px"><button class="btn ghost active" onclick="setTimer(25,this)">25 دقيقة</button><button class="btn ghost" onclick="setTimer(50,this)">50 دقيقة</button><button class="btn ghost" onclick="setTimer(45,this)">45 دقيقة</button></div><div class="timer-circle" id="timer">25:00</div><div class="timer-controls"><button class="btn primary" id="timerBtn" onclick="startTimer()">▶ ابدأ</button><button class="btn ghost" onclick="resetTimer()">↺ إعادة</button></div><p class="muted" style="margin-top:18px">بعد الجلسة خد راحة قصيرة 🌿</p></section>`)}
function setTimer(m,b){clearInterval(timer);seconds=m*60;document.getElementById('timer').textContent=`${m}:00`;document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('timerBtn').textContent='▶ ابدأ'}
function startTimer(){if(timer){clearInterval(timer);timer=null;document.getElementById('timerBtn').textContent='▶ استكمال';return}document.getElementById('timerBtn').textContent='⏸ إيقاف';timer=setInterval(()=>{seconds--;let m=Math.floor(seconds/60),s=seconds%60;document.getElementById('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;if(seconds<=0){clearInterval(timer);timer=null;state.minutes+=25;save();alert('خلصت الجلسة! أحسنت 🎉');document.getElementById('timerBtn').textContent='▶ ابدأ'}},1000)}
function resetTimer(){clearInterval(timer);timer=null;seconds=25*60;document.getElementById('timer').textContent='25:00';document.getElementById('timerBtn').textContent='▶ ابدأ'}
function subjects(){shell(`<section class="card"><h2>📚 موادي</h2><p class="muted" style="margin:8px 0 20px">المواد اللي اخترتها في حسابك.</p><div class="subjects">${state.subjects.map(s=>`<div class="subject on"><span class="check">✓</span>${s}</div>`).join('')}</div></section>`)}
function notes(){shell(`<section class="card notes"><h2>📝 الملاحظات</h2><p class="muted" style="margin:8px 0">اكتب ملخصاتك وأفكارك هنا.</p><textarea id="notes">${state.notes||''}</textarea><button class="btn primary" style="margin-top:12px" onclick="saveNotes()">حفظ الملاحظات 💾</button></section>`)}
function saveNotes(){state.notes=document.getElementById('notes').value;save();alert('تم حفظ الملاحظات ✅')}
function stats(){shell(`<div class="grid4"><div class="card stat">⏱️ إجمالي المذاكرة<strong>${state.minutes} دقيقة</strong></div><div class="card stat">🔥 Streak<strong>${state.streak} يوم</strong></div><div class="card stat">📚 المواد<strong>${state.subjects.length}</strong></div><div class="card stat">🏆 المستوى<strong>Level 1</strong></div></div><section class="card" style="margin-top:18px"><h2>📈 تقدمك</h2><p class="muted" style="margin-top:8px">كل جلسة مذاكرة ومهمة مكتملة بتساعدك تبني عادات أفضل.</p></section>`)}
function settings(){shell(`<section class="card"><h2>⚙️ الإعدادات</h2><div class="setting-row"><span>🔊 أصوات الجلسة</span><button class="switch ${state.sound?'on':''}" onclick="state.sound=!state.sound;save();settings()">${state.sound?'مفعّل':'متوقف'}</button></div><div class="setting-row"><span>🌙 المظهر</span><button class="switch" onclick="toggleTheme()">${state.theme==='dark'?'داكن':'فاتح'}</button></div><div class="setting-row"><span>🌐 اللغة</span><button class="switch" onclick="toggleLang()">${state.lang==='ar'?'العربية':'English'}</button></div><div class="setting-row"><span>🎨 الخلفية</span><button class="switch" onclick="alert('الخلفية الحالية: تدرج هادئ ✨')">معاينة</button></div></section>`)}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.style.setProperty('--bg1',state.theme==='dark'?'#15182a':'#eef7ff');document.documentElement.style.setProperty('--bg2',state.theme==='dark'?'#20233b':'#f5f1ff');document.documentElement.style.setProperty('--card',state.theme==='dark'?'#24283d':'#fff');document.documentElement.style.setProperty('--text',state.theme==='dark'?'#f5f6ff':'#17233c');save();settings()}
function toggleLang(){state.lang=state.lang==='ar'?'en':'ar';alert(state.lang==='en'?'English mode is ready for the main controls.':'تم الرجوع للعربية.');save();settings()}
function createAccount(){if(!confirm('إنشاء حساب جديد؟ سيتم بدء إعداد حساب جديد.'))return;state={setup:false,name:'',age:'',gender:'',grade:'',character:'',subjects:[],tasks:[],notes:'',minutes:0,streak:0,theme:'light',sound:true,lang:'ar'};save();closeSide();render()}
function deleteAccount(){if(!confirm('متأكد إنك عايز تحذف الحساب؟'))return;localStorage.removeItem('studyQuest');state={setup:false,subjects:[],tasks:[],notes:'',minutes:0,streak:0,theme:'light',sound:true,lang:'ar'};closeSide();render()}
render();
</script>
</body>
</html>
