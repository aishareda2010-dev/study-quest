<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Quest</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #183b2a;
    }

    .welcome {
      width: min(90%, 700px);
      text-align: center;
      background: rgba(255, 255, 255, 0.8);
      padding: 60px 30px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    }

    .logo {
      font-size: 48px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
      margin-bottom: 35px;
      color: #527064;
    }

    .start-btn {
      border: none;
      padding: 16px 35px;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #2e7d5b;
      color: white;
      transition: 0.2s;
    }

    .start-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>

  <div class="welcome">
    <div class="logo">📚</div>

    <h1>Study Quest</h1>

    <p>رحلتك في المذاكرة تبدأ من هنا ✨</p>

    <button class="start-btn" onclick="startJourney()">
      ابدأ رحلتك 🚀
    </button>
  </div>

  <script>
    function startJourney() {
      alert("هنبدأ نجهز حسابك! 🚀");
    }
  </script>

</body>
</html>
